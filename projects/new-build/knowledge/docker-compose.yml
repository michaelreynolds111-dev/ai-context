services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Melbourne
    volumes:
      - ./prowlarr-config:/config
      - ./usenet-blackhole/nzb:/blackhole
    ports:
      - "9696:9696"
    dns:
      - 1.1.1.1
      - 8.8.8.8

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=Australia/Melbourne
    ports:
      - "8191:8191"

  bitmagnet:
    image: ghcr.io/bitmagnet-io/bitmagnet:latest
    container_name: bitmagnet
    restart: unless-stopped
    ports:
      - "3333:3333"
      - "3334:3334/tcp"
      - "3334:3334/udp"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=<REDACTED - see docker-compose.yml on disk at C:\torbox-system>
      - TMDB_ENABLED=false
    volumes:
      - C:\docker\bitmagnet-config:/root/.config/bitmagnet
    command: ["worker", "run", "--keys=http_server", "--keys=queue_server", "--keys=dht_crawler"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: bitmagnet-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=<REDACTED - see docker-compose.yml on disk at C:\torbox-system>
      - POSTGRES_DB=bitmagnet
      - PGUSER=postgres
    volumes:
      - C:\docker\bitmagnet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  rdtclient:
    image: rogerfar/rdtclient
    container_name: rdtclient
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Melbourne
    volumes:
      - C:\appdata\rdtclient:/data/db
      - D:\Downloads\_staging:/data/downloads
    ports:
      - "6500:6500"

  stash-torbox-bridge:
    build: ./stash-torbox-bridge
    container_name: stash-torbox-bridge
    restart: unless-stopped
    env_file: ./stash-torbox-bridge/.env
    volumes:
      - ./stash-torbox-bridge/data:/app/data
    ports:
      - "8770:8770"

  torboxhole:
    image: ghcr.io/lennoxlotl/torboxhole:2.0.0
    container_name: torboxhole
    restart: unless-stopped
    volumes:
      - ./usenet-blackhole/config.toml:/opt/torboxhole/config.toml
      - ./usenet-blackhole/nzb:/data/nzb
      - ./usenet-blackhole/complete:/data/complete
      - ./usenet-blackhole/incomplete:/data/incomplete
      - ./usenet-blackhole/db:/data/db
