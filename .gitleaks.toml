title = "ai-context gitleaks config"

[extend]
# Start from gitleaks' default/built-in rule set (API keys, tokens, private keys, etc.)
useDefault = true

# --- Australian household identifiers (v1.1 Cluster 6) ---
# These are pattern-shaped heuristics, not checksum-validated. False positives
# are expected and acceptable here -- the cost of a blocked commit is low,
# the cost of a missed identifier is not (see plan §4.4a).

[[rules]]
id = "au-tfn"
description = "Australian Tax File Number (9 digits, optionally spaced 3-3-3)"
regex = '''\b\d{3}[\s-]?\d{3}[\s-]?\d{3}\b'''
tags = ["identity", "au", "tfn"]

[[rules]]
id = "au-medicare"
description = "Australian Medicare number (10-11 digits, often spaced 4-5-1(-1))"
regex = '''\b\d{4}[\s-]?\d{5}[\s-]?\d{1}(?:[\s-]?\d{1})?\b'''
tags = ["identity", "au", "medicare"]

[[rules]]
id = "au-passport"
description = "Australian passport number (1 letter + 7-8 digits)"
regex = '''\b[A-Za-z]\d{7,8}\b'''
tags = ["identity", "au", "passport"]

[[rules]]
id = "au-drivers-licence"
description = "Generic AU drivers licence shaped string (6-10 alphanumeric)"
regex = '''(?i)licen[cs]e[_\s#:-]{0,3}[A-Za-z0-9]{6,10}\b'''
tags = ["identity", "au", "licence"]

[allowlist]
description = "Reduce noise from obvious non-identifier numeric strings"
paths = [
  '''\.gitleaks\.toml$''',
]

